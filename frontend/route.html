<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review your route · Lilikas na ga?</title>
<meta name="theme-color" content="#0e0709">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<main id="page" data-nav="map">
  <a class="back" href="map.html"><i data-icon="arrowL"></i> Back to hazard map & evacuation</a>
  <section class="sheet wide">
    <div class="head" style="display:flex;gap:14px;align-items:flex-start"><span class="ib" style="flex:none"><i data-icon="route"></i></span>
      <div><h1>Review your destination and travel details</h1><p>Check the destination and route limitations. This is not an official evacuation order or a guarantee of a safe route.</p></div></div>
    <div class="route-grid">
      <div>
        <div class="map" id="map"></div>
        <div class="info-row warn" id="geom"><i data-icon="info" style="color:var(--red)"></i><span>Geometry only</span></div>
        <div class="info-row"><i data-icon="clock"></i><span id="fresh">Information freshness</span></div>
      </div>
      <div class="card pad" style="box-shadow:none;border:1px solid var(--line)" id="dest"><div class="skel" style="height:200px"></div></div>
    </div>
  </section>
</main>
<script src="assets/js/config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/vendor/leaflet/leaflet.js"></script>
<script src="assets/js/mapkit.js"></script>
<script src="assets/js/assist.js"></script>
<script>
(() => {
  const { $, $$, esc, icon, api, pct } = LNG;
  const qs = new URLSearchParams(location.search);
  let mode = qs.get("mode") === "driving" ? "driving" : "walking", to = qs.get("to");
  const l0 = LNG.loc(), kit = MapKit.create($("#map"), { lat: l0.lat, lon: l0.lon, zoom: 15 });
  kit.addHazard("flood");
  async function load() {
    const l = LNG.loc();
    let plan;
    try { plan = await api(`/api/route?lat=${l.lat}&lon=${l.lon}&mode=${mode}` + (to ? `&to=${encodeURIComponent(to)}` : ""), { timeout: 30000 }); }
    catch (e) { $("#dest").innerHTML = `<div class="notice warn">${esc(e.message)}</div><a class="btn" href="map.html" style="margin-top:12px">Choose another center</a>`; return; }
    const r = plan.routes.find(x => x.center.id === plan.selected_id) || plan.routes[0];
    if (!r) { $("#dest").innerHTML = `<div class="notice warn">No open center with space is available right now.</div><a class="btn" href="map.html" style="margin-top:12px">Back to the map</a>`; return; }
    to = r.center.id;
    let c = r.center; try { c = (await api("/api/centers")).find(x => x.id === to) || c; } catch {}
    kit.setYou(l.lat, l.lon); kit.setRoute([r], to); kit.setCenters([c], { selected: to, labels: true }); kit.fit([[l.lat, l.lon], ...r.geometry]);
    const road = r.geometry_type === "road";
    $("#geom").lastChild.textContent = road ? "Road geometry from OpenStreetMap. It cannot see flooding, closures or traffic." : "Geometry only: a straight-line estimate, because the road-routing service could not be reached.";
    $("#fresh").textContent = `Information freshness: center numbers ${c.updated ? "updated " + c.updated : "from the last update"} (simulated for the demo).`;
    const dest = `${c.lat},${c.lon}`, from = `${l.lat},${l.lon}`;
    $("#dest").innerHTML = `<span class="badge ${c.status}">${icon("checkCircle")} ${esc(c.status)}</span><br><span class="center-name">${esc(c.name)}</span>
      <div class="cap"><span>${c.occupied ?? ""} / ${c.capacity ?? ""} capacity</span><span>${c.spaces ?? Math.max(0, c.capacity - c.occupied)} spaces shown</span></div>
      <div class="bar"><i style="width:${pct(c.occupied, c.capacity)}%"></i></div>
      <div class="kv" style="margin-top:12px"><span>From</span><span>${icon("pin")} ${esc(l.label)} · ${l.source === "device" ? "Device location" : "Manual selection"}</span></div>
      <p style="font-size:12px;font-weight:700;margin:10px 0 6px">Travel mode</p>
      <div class="seg" role="group" aria-label="Travel mode"><button data-mode="walking" aria-pressed="${mode === "walking"}">${icon("walk")} Walking${mode === "walking" ? " · Selected" : ""}</button><button data-mode="driving" aria-pressed="${mode === "driving"}">${icon("car")} Driving${mode === "driving" ? " · Selected" : ""}</button></div>
      <div class="stat2"><div><b>${r.distance_km.toFixed(1)} <small>km</small></b>Distance</div><div><b>${Math.round(r.duration_min)} <small>min</small></b>${mode === "walking" ? "Walking time" : "Estimated drive time"}</div></div>
      <div class="notice warn">${icon("info")}<div><b style="display:block">Confirm before travelling</b><span class="serif">Check official advice, destination availability and road safety with authorities. Routes may miss flooding, closures or impassable roads. Never walk or drive through floodwater. Follow official evacuation instructions if issued.</span></div></div>
      ${r.warnings.map(w => `<div class="notice warn" style="margin-top:8px">${icon("alert")}<span>${esc(w)}</span></div>`).join("")}
      <div class="row" style="margin-top:16px;flex-wrap:wrap"><a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${from}&destination=${dest}&travelmode=${mode}">${icon("ext")} Open directions</a>
        <a class="btn" href="map.html">Choose another center</a><a class="btn ghost" href="map.html">Cancel</a></div>`;
    $$("#dest [data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; LNG.store.set("mode", mode); history.replaceState(null, "", `?to=${to}&mode=${mode}`); load(); });
  }
  LNG.on("location", load);
  load();
})();
</script>
</body>
</html>
